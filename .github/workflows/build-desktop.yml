name: Build desktop clients

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  mac-native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify native architecture
        run: test "$(uname -m)" = "arm64"
      - run: npm run package:mac:native -- --arm64 --config.directories.output=release/mac-arm64
      - name: Verify app architecture
        shell: bash
        run: |
          APP_PATH=$(find release/mac-arm64 -maxdepth 2 -name '圣经讲义.app' -type d -print -quit)
          test -n "$APP_PATH"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/圣经讲义")" = "arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-Apple-Silicon
          path: release/mac-arm64/*-mac-arm64.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
          cache: npm
      - run: npm ci
      - run: npm run package:win -- --x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*-windows-x64-setup.exe
          if-no-files-found: error
