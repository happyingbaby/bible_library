server {
    listen 80;
    server_name library.fdeline.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/bible-library/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name library.fdeline.com;

    ssl_certificate /www/server/panel/vhost/cert/library.fdeline.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/library.fdeline.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 205m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
