services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bible-library-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      BIBLE_HOST: 127.0.0.1
      BIBLE_PORT: 8765
      BIBLE_DATA_DIR: /data
      BIBLE_REQUIRE_APP_KEY: "0"
      BIBLE_ALLOW_CONNECTION_CONFIG: "0"
    volumes:
      - /www/wwwroot/bible-library/data:/data
