[project]
name = "backend-win32-build"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "markdown-it-py>=3,<5",
    "pydantic>=2.13.5,<3",
    "pymysql>=1.1,<2",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
build = ["pyinstaller>=6.22.2,<7"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "ustc"
url = "https://pypi.mirrors.ustc.edu.cn/simple/"
default = true
